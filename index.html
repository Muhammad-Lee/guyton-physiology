<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>گایتون ۲۰۱۶ · ۱۵ فصل</title>
    
    <!-- ============================================================
    PWA Meta Tags (هماهنگ با manifest.json)
    ============================================================ -->
    <link rel="manifest" href="/guyton-physiology/manifest.json" />
    <meta name="theme-color" content="#1a5e7a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="گایتون ۲۰۱۶" />
    <link rel="apple-touch-icon" href="/guyton-physiology/icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/guyton-physiology/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/guyton-physiology/icon-512.png" />

    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== RESET & BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #f2f7fb;
            color: #1a2a3a;
            padding: 16px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            transition: background 0.3s, color 0.3s;
        }
        body.dark {
            background: #1a2630;
            color: #dce8f0;
        }
        .app {
            max-width: 1100px;
            width: 100%;
            background: rgba(255,255,255,0.88);
            backdrop-filter: blur(6px);
            border-radius: 40px;
            padding: 26px 28px 18px;
            box-shadow: 0 30px 60px -20px rgba(0,20,40,0.35);
            border: 1px solid rgba(255,255,255,0.4);
            transition: background 0.3s, border 0.3s;
            min-height: 90vh;
        }
        body.dark .app {
            background: rgba(26,38,48,0.92);
            border-color: rgba(255,255,255,0.06);
        }
        .page { display: none; animation: fadeIn 0.3s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { 0% { opacity:0; transform:translateY(10px); } 100% { opacity:1; transform:translateY(0); } }

        /* ===== HOME HEADER ===== */
        .home-header { text-align: center; margin-bottom: 18px; }
        .home-header .main-title {
            font-size: 2.4rem; font-weight: 900; letter-spacing: -0.5px;
            background: linear-gradient(135deg, #0a3147, #1a5e7a);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            display: inline-block;
        }
        body.dark .home-header .main-title {
            background: linear-gradient(135deg, #8ab8d4, #4a90b0);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .home-header .main-title sup {
            font-size: 0.65em; font-weight: 400; color: #6a8aa0;
            -webkit-text-fill-color: #6a8aa0; background: none; margin-right: 2px;
        }
        body.dark .home-header .main-title sup { color: #7a9aaa; -webkit-text-fill-color: #7a9aaa; }
        .home-header .sub {
            font-size: 0.95rem; color: #3a5e7a; background: #dce8f0;
            display: inline-block; padding: 2px 24px; border-radius: 40px; margin-top: -2px;
            font-weight: 400; letter-spacing: 0.3px;
        }
        body.dark .home-header .sub { background: #2a4050; color: #b0c8d8; }
        .badge-note {
            background: #fcf6e7; border: 1px solid #f4c542; border-radius: 30px;
            padding: 8px 20px; margin: 10px auto 0; display: inline-block;
            font-size: 0.85rem; color: #1f4055; max-width: 700px;
        }
        body.dark .badge-note { background: #2a3a3a; border-color: #b8a040; color: #d0d8d0; }
        .badge-note i { color: #e68a2e; margin-left: 8px; }
        .search-box {
            max-width: 400px; margin: 12px auto 16px; position: relative;
        }
        .search-box input {
            width: 100%; padding: 10px 18px 10px 44px; border-radius: 60px;
            border: 2px solid #d0dde8; background: white;
            font-family: 'Vazirmatn', sans-serif; font-size: 0.95rem; outline: none; transition: 0.2s;
        }
        body.dark .search-box input { background: #2a3a48; border-color: #4a5a6a; color: #dce8f0; }
        .search-box input:focus { border-color: #1a5e7a; box-shadow: 0 0 0 4px rgba(26,94,122,0.12); }
        .search-box i {
            position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
            color: #7a9bb5; font-size: 1rem;
        }
        .toolbar {
            display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px;
        }
        .toolbar button {
            background: #eef4fa; border: none; border-radius: 40px; padding: 6px 18px;
            font-family: 'Vazirmatn', sans-serif; font-weight: 700; font-size: 0.85rem;
            color: #0a3147; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 6px;
        }
        body.dark .toolbar button { background: #2a3a48; color: #d0dce8; }
        .toolbar button:hover { background: #d4e3ed; transform: scale(0.97); }
        body.dark .toolbar button:hover { background: #3a4a5a; }

        .chapter-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
            gap: 14px; margin-top: 4px;
        }
        .chapter-card {
            background: white; border-radius: 20px; padding: 16px 12px;
            box-shadow: 0 4px 12px -4px rgba(0,32,64,0.06);
            border: 1px solid rgba(0,0,0,0.02); cursor: pointer; transition: 0.25s;
            text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px;
        }
        body.dark .chapter-card { background: #2a3a48; border-color: #3a4a5a; }
        .chapter-card:hover { transform: translateY(-4px); box-shadow: 0 12px 28px -10px rgba(18,67,112,0.18); border-color: #bdd0dd; }
        body.dark .chapter-card:hover { border-color: #5a7a8a; }
        .chapter-card .num { font-size: 2rem; font-weight: 900; color: #1a5e7a; line-height: 1; }
        body.dark .chapter-card .num { color: #6aa0c0; }
        .chapter-card .num i { font-size: 1.5rem; color: #e76f51; margin-left: 6px; }
        .chapter-card .title { font-weight: 700; font-size: 0.95rem; color: #0a3147; }
        body.dark .chapter-card .title { color: #d0dce8; }
        .chapter-card .badge-sm {
            background: #eef4fa; border-radius: 30px; padding: 0 12px; font-size: 0.7rem;
            color: #1a5e7a; font-weight: 700;
        }
        body.dark .chapter-card .badge-sm { background: #3a4a5a; color: #8ab0c8; }
        .no-result { grid-column: 1 / -1; text-align: center; padding: 30px; color: #6a8aa0; font-weight: 500; }

        /* ===== CHAPTER PAGE ===== */
        .chapter-nav {
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 10px; margin-bottom: 14px;
            padding-bottom: 10px; border-bottom: 2px solid #e3ecf3;
        }
        body.dark .chapter-nav { border-bottom-color: #3a4a5a; }
        .chapter-nav .back-btn {
            background: #eef4fa; border: none; border-radius: 40px; padding: 6px 20px;
            font-family: 'Vazirmatn', sans-serif; font-weight: 700; font-size: 0.9rem;
            color: #0a3147; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 6px;
        }
        body.dark .chapter-nav .back-btn { background: #2a3a48; color: #d0dce8; }
        .chapter-nav .back-btn:hover { background: #d4e3ed; transform: scale(0.97); }
        .chapter-nav .chapter-title { font-size: 1.4rem; font-weight: 800; color: #0a3147; }
        body.dark .chapter-nav .chapter-title { color: #d0dce8; }
        .chapter-nav .chapter-title i { color: #e76f51; margin-left: 8px; }

        /* ===== CONTENT STYLES ===== */
        .chapter-content { font-size: 1rem; }
        .chapter-content .section {
            background: white; border-radius: 24px; padding: 18px 20px; margin: 14px 0;
            box-shadow: 0 4px 12px -6px rgba(0,32,64,0.05); border: 1px solid rgba(0,0,0,0.02);
        }
        body.dark .chapter-content .section { background: #26323e; border-color: #3a4a5a; }
        .chapter-content .section h2 {
            font-size: 1.4rem; font-weight: 800; color: #0a3147;
            border-right: 6px solid #2a7f9c; padding-right: 14px; margin-bottom: 8px;
            display: flex; align-items: center; gap: 10px;
        }
        body.dark .chapter-content .section h2 { color: #d0dce8; }
        .chapter-content .section h2 i { color: #e76f51; font-size: 1.3rem; width: 2rem; }
        .chapter-content .section h3 {
            font-weight: 700; color: #1d4b66; margin: 10px 0 4px; font-size: 1.1rem;
            display: flex; align-items: center; gap: 8px;
        }
        body.dark .chapter-content .section h3 { color: #aac0d0; }
        .chapter-content .section h3 i { color: #2a7f9c; }
        .chapter-content .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        @media (max-width:650px) { .chapter-content .grid-2 { grid-template-columns: 1fr; } }
        .chapter-content .box-blue { background: #eef4fa; border-radius: 18px; padding: 12px 16px; border-right: 4px solid #1a5e7a; }
        body.dark .chapter-content .box-blue { background: #1a2e3a; border-right-color: #4a8aaa; }
        .chapter-content .box-gold { background: #fcf6e7; border-radius: 18px; padding: 12px 16px; border-right: 4px solid #f4c542; }
        body.dark .chapter-content .box-gold { background: #2a2a20; border-right-color: #b8a040; }
        .chapter-content .box-red { background: #fdeeea; border-radius: 18px; padding: 12px 16px; border-right: 4px solid #e76f51; }
        body.dark .chapter-content .box-red { background: #2a1e1a; border-right-color: #b85a40; }
        .chapter-content .box-green { background: #e6f4ea; border-radius: 18px; padding: 12px 16px; border-right: 4px solid #2a7a3a; }
        body.dark .chapter-content .box-green { background: #1a2a1e; border-right-color: #3a8a4a; }
        .chapter-content .highlight { background: #dff0f9; border-radius: 16px; padding: 10px 16px; margin: 8px 0; border-right: 5px solid #1a5e7a; }
        body.dark .chapter-content .highlight { background: #1a2e3a; border-right-color: #4a8aaa; }
        .chapter-content .highlight i { color: #e68a2e; margin-left: 8px; }
        .chapter-content .formula-box {
            background: #eaf3fa; border-radius: 16px; padding: 10px 18px; text-align: center;
            font-weight: 700; color: #0a3147; border: 2px dashed #2a7f9c; margin: 6px 0;
        }
        body.dark .chapter-content .formula-box { background: #1a2e3a; border-color: #4a8aaa; color: #d0dce8; }
        .chapter-content .table-wrap { overflow-x: auto; border-radius: 16px; background: #f5f9fd; padding: 4px; }
        body.dark .chapter-content .table-wrap { background: #1a2a36; }
        .chapter-content table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        .chapter-content th { background: #0a3147; color: white; font-weight: 700; padding: 8px 10px; text-align: center; }
        body.dark .chapter-content th { background: #1a4058; }
        .chapter-content td { padding: 8px 10px; background: white; border-bottom: 1px solid #e0eaf2; text-align: center; }
        body.dark .chapter-content td { background: #26323e; border-bottom-color: #3a4a5a; color: #d0dce8; }
        .chapter-content th:first-child { border-radius: 14px 0 0 0; }
        .chapter-content th:last-child { border-radius: 0 14px 0 0; }
        .chapter-content tr:last-child td:first-child { border-radius: 0 0 0 14px; }
        .chapter-content tr:last-child td:last-child { border-radius: 0 0 14px 0; }
        .chapter-content .key-number { background: #0a3147; color: white; border-radius: 30px; padding: 0 12px; font-weight: 700; display: inline-block; font-size: 0.8rem; }
        body.dark .chapter-content .key-number { background: #1a4058; }
        .chapter-content ul, .chapter-content ol { padding-right: 20px; }
        .chapter-content ul li, .chapter-content ol li { padding: 2px 0; }
        .chapter-content .two-col-list { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; }
        @media (max-width:550px) { .chapter-content .two-col-list { grid-template-columns: 1fr; } }
        .chapter-content .step-list { list-style: none; padding-right: 0; counter-reset: step; }
        .chapter-content .step-list li { counter-increment: step; padding: 4px 0; display: flex; align-items: flex-start; gap: 10px; }
        .chapter-content .step-list li::before {
            content: counter(step); background: #1a5e7a; color: white; border-radius: 50%;
            width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 0.75rem; flex-shrink: 0; margin-top: 2px;
        }
        body.dark .chapter-content .step-list li::before { background: #3a7a9a; }
        .chapter-content .flex-row {
            display: flex; flex-wrap: wrap; gap: 8px 16px; background: #f5f9fd;
            border-radius: 18px; padding: 10px 16px; margin: 4px 0; border: 1px solid #d0dde8;
        }
        body.dark .chapter-content .flex-row { background: #1a2a36; border-color: #3a4a5a; }
        .chapter-content .flex-row span { display: flex; align-items: center; gap: 4px; font-weight: 500; }
        .chapter-content .footnote-chapter {
            background: #eef3f7; border-radius: 30px; padding: 12px 22px; margin: 16px 0 4px;
            color: #1f4055; border: 1px solid #cbdce8; display: flex; align-items: center;
            gap: 12px; flex-wrap: wrap; font-size: 0.9rem;
        }
        body.dark .chapter-content .footnote-chapter { background: #1a2a36; border-color: #3a4a5a; color: #b0c8d8; }
        .chapter-content .footnote-chapter i { color: #1a7a3a; font-size: 1.4rem; }
        .brand-footer {
            text-align: center; margin-top: 22px; padding-top: 12px;
            border-top: 1px solid #d0dde8; font-size: 0.7rem; font-weight: 300;
            color: #a0b8cc; letter-spacing: 1px;
        }
        body.dark .brand-footer { border-top-color: #3a4a5a; color: #5a7a8a; }
        @media (max-width:550px) {
            .app { padding: 14px; }
            .home-header .main-title { font-size: 1.6rem; }
            .home-header .sub { font-size: 0.8rem; padding: 2px 16px; }
            .chapter-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
            .chapter-card { padding: 12px 8px; }
            .chapter-card .num { font-size: 1.6rem; }
            .chapter-nav .chapter-title { font-size: 1.1rem; }
            .chapter-content { font-size: 0.95rem; }
            .chapter-content .section { padding: 14px 14px; }
            .toolbar button { font-size: 0.75rem; padding: 4px 14px; }
        }
        @media (min-width:768px) { .chapter-content { font-size: 1.05rem; } }
    </style>
</head>
<body>
<div class="app" id="app">

    <!-- ========================================================= -->
    <!-- PAGE: HOME -->
    <!-- ========================================================= -->
    <div class="page active" id="page-home">
        <div class="home-header">
            <div class="main-title">فیزیولوژی گایتون <sup>۲۰۱۶</sup></div>
            <div class="sub">خلاصه مفاهیم کلیدی · ۱۵ فصل</div>
            <div class="badge-note">
                <i class="fas fa-info-circle"></i>
                این خلاصه از مفاهیم کلیدی کتاب <strong>خلاصه فیزیولوژی گایتون/هال ۲۰۱۶</strong> است.
                مطالعه آن به عنوان <strong>مکمل</strong> کتاب اصلی توصیه می‌شود.
            </div>
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="جستجوی فصل ..." onkeyup="filterChapters()" />
            </div>
            <div class="toolbar">
                <button onclick="toggleDarkMode()"><i class="fas fa-moon"></i> حالت شب</button>
                <button onclick="window.print()"><i class="fas fa-print"></i> چاپ</button>
            </div>
        </div>
        <div class="chapter-grid" id="chapterGrid"></div>
        <div class="brand-footer">Mr.Lee</div>
    </div>

    <!-- ========================================================= -->
    <!-- PAGE: CHAPTER -->
    <!-- ========================================================= -->
    <div class="page chapter-page" id="page-chapter">
        <div class="chapter-nav">
            <button class="back-btn" onclick="goHome()"><i class="fas fa-arrow-right"></i> فهرست</button>
            <div class="chapter-title" id="chapterTitle"><i class="fas fa-book"></i> فصل</div>
            <div style="display:flex; gap:6px;">
                <button class="back-btn" onclick="window.print()" style="background:#dce8f0; padding:6px 14px; font-size:0.8rem;"><i class="fas fa-print"></i></button>
                <button class="back-btn" onclick="toggleDarkMode()" style="background:#dce8f0; padding:6px 14px; font-size:0.8rem;"><i class="fas fa-moon"></i></button>
            </div>
        </div>
        <div class="chapter-content" id="chapterContent"></div>
        <div style="margin-top:14px; text-align:center;">
            <button class="back-btn" onclick="goHome()" style="background:#dce8f0; border:none; border-radius:40px; padding:6px 24px; font-family:'Vazirmatn',sans-serif; font-weight:700; font-size:0.9rem; color:#0a3147; cursor:pointer;">
                <i class="fas fa-arrow-right"></i> بازگشت به فهرست
            </button>
        </div>
        <div class="brand-footer" style="margin-top:14px;">Mr.Lee</div>
    </div>

</div>

<script>
    // ============================================================
    //  ۱. ثبت Service Worker (هماهنگ با sw.js)
    // ============================================================
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
            navigator.serviceWorker.register('/guyton-physiology/sw.js')
                .then(function(registration) {
                    console.log('✅ Service Worker ثبت شد با موفقیت:', registration);
                })
                .catch(function(error) {
                    console.log('❌ خطا در ثبت Service Worker:', error);
                });
        });
    }

    // ============================================================
    //  ۲. داده‌های ۱۵ فصل
    // ============================================================
    const chapters = [
        // ===== فصل ۱ =====
        {
            id: 1,
            title: 'فیزیولوژی عمومی و سلول',
            icon: 'fa-solid fa-microscope',
            color: '#1a5e7a',
            content: `
                <div class="section">
                    <h2><i class="fas fa-scale-balanced"></i> همئوستاز (Homeostasis)</h2>
                    <p><strong>تعریف:</strong> حفظ شرایط تقریباً ثابت در <strong>محیط داخلی</strong> (مایع خارج سلولی).</p>
                    <div class="highlight">
                        <i class="fas fa-lightbulb"></i>
                        <strong>نکته کلیدی:</strong> تمام ارگان‌های بدن برای حفظ همئوستاز تلاش می‌کنند:
                        <ul style="margin-top:6px; list-style:disc; padding-right:24px;">
                            <li>دستگاه تنفس ← تنظیم گازها</li>
                            <li>دستگاه گوارش ← تنظیم مواد غذایی</li>
                            <li>دستگاه کلیوی ← تنظیم یون‌ها و مایعات</li>
                        </ul>
                    </div>
                    <div class="box-gold">
                        <i class="fas fa-history"></i> <strong>کلود برنارد</strong> (فیزیولوژیست فرانسوی) بیش از ۱۰۰ سال پیش اصطلاح <strong>«محیط داخلی»</strong> را برای مایع خارج سلولی، خون و لنف به کار برد.
                    </div>
                </div>
                <div class="section">
                    <h2><i class="fas fa-droplet"></i> مایعات بدن (ECF &amp; ICF)</h2>
                    <div class="grid-2">
                        <div class="box-blue">
                            <h3 style="margin-top:0;"><i class="fas fa-solid fa-water"></i> مایع خارج سلولی (ECF)</h3>
                            <ul style="list-style: none; padding-right: 0;">
                                <li><i class="fas fa-check-circle" style="color:#1a5e7a;"></i> یک‌سوم آب بدن (۲۰٪ وزن)</li>
                                <li><i class="fas fa-check-circle" style="color:#1a5e7a;"></i> <strong>سدیم</strong> بالا، کلر، بی‌کربنات</li>
                                <li><i class="fas fa-check-circle" style="color:#1a5e7a;"></i> اکسیژن، گلوکز، اسیدهای چرب</li>
                            </ul>
                        </div>
                        <div class="box-blue">
                            <h3 style="margin-top:0;"><i class="fas fa-solid fa-house-chimney"></i> مایع داخل سلولی (ICF)</h3>
                            <ul style="list-style: none; padding-right: 0;">
                                <li><i class="fas fa-check-circle" style="color:#b1653b;"></i> دو‌سوم آب بدن (۴۰٪ وزن)</li>
                                <li><i class="fas fa-check-circle" style="color:#b1653b;"></i> <strong>پتاسیم</strong> بالا، منیزیم، فسفات</li>
                                <li><i class="fas fa-check-circle" style="color:#b1653b;"></i> پروتئین‌های داخل سلولی</li>
                            </ul>
                        </div>
                    </div>
                    <div class="highlight" style="background:#fcf6e7; border-right-color:#f4c542;">
                        <i class="fas fa-gem" style="color:#f4c542;"></i>
                        <strong>نکته کلیدی:</strong> «سدیم بیرونه، پتاسیم درونه!»  
                        <span style="display:block; margin-top:4px; font-size:0.95rem;">این ترکیب برای پتانسیل غشا و انتقال پیام عصبی حیاتی است.</span>
                    </div>
                </div>
                <div class="section">
                    <h2><i class="fas fa-table"></i> جدول ۱-۱: ترکیبات مهم ECF</h2>

    function renderHome(filter) {
        filter = filter || '';
        const grid = document.getElementById('chapterGrid');
        const q = filter.trim().toLowerCase();
        let html = '', found = 0;
        chapters.forEach(ch => {
            if (ch.title.includes(q) || ch.id.toString().includes(q)) {
                found++;
                html += `<div class="chapter-card" onclick="openChapter(${ch.id})">
                    <div class="num">${ch.id} <i class="${ch.icon}"></i></div>
                    <div class="title">${ch.title}</div>
                    <div class="badge-sm">فصل ${ch.id}</div>
                </div>`;
            }
        });
        if (!found) html = '<div class="no-result"><i class="fas fa-search" style="margin-left:10px;"></i> فصلی با این نام یافت نشد.</div>';
        grid.innerHTML = html;
    }

    function filterChapters() {
        const input = document.getElementById('searchInput');
        renderHome(input.value);
    }

    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function goHome() {
        showPage('page-home');
        document.getElementById('searchInput').value = '';
        renderHome('');
    }

    function openChapter(id) {
        const ch = chapters.find(c => c.id === id);
        if (!ch) return;
        document.getElementById('chapterTitle').innerHTML = `<i class="${ch.icon}" style="color:${ch.color};"></i> فصل ${ch.id} · ${ch.title}`;
        document.getElementById('chapterContent').innerHTML = ch.content;
        showPage('page-chapter');
    }

    function toggleDarkMode() {
        document.body.classList.toggle('dark');
        document.querySelectorAll('.toolbar button i.fa-moon, .chapter-nav button i.fa-moon').forEach(el => {
            el.className = document.body.classList.contains('dark') ? 'fas fa-sun' : 'fas fa-moon';
        });
    }

    //  ۴. مقداردهی اولیه
    // ============================================================
